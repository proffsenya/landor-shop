spring.application.name=backend
server.port=8080

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://db:5432/landorshop}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:password}

spring.sql.init.mode=never
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
#spring.sql.init.schema-locations=classpath:db/migration/V1__create_tables.sql,classpath:db/migration/V2__add_constraints.sql
#spring.sql.init.data-locations=classpath:db/seed/V100__seed_base_data.sql

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Оптимизация загрузки связанных сущностей - batch size
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
# Оптимизация для загрузки коллекций
spring.jpa.properties.hibernate.default_batch_fetch_size=20

admin.email=${ADMIN_EMAIL:admin@landorshop.ru}
admin.password=${ADMIN_PASSWORD:ChangeMe123!}
admin.firstName=${ADMIN_FIRST_NAME:?????}
admin.lastName=${ADMIN_LAST_NAME:?????????}
admin.phone=${ADMIN_PHONE:+79991234567}


spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.resolve-lazily=false

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.com.example.backend=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

spring.docker.compose.enabled=false

# Email configuration (SMTP)
# Для использования локального SMTP на VPS (например, Postfix на порту 25)
# Или для внешних SMTP (Gmail, Yandex, Mail.ru)
# Настройки для Yandex согласно официальной инструкции:
# https://help.reg.ru/support/pochta-i-servisy/google-workspace/nastroyka-pochtovykh-kliyentov-dlya-yandeks-pochtyy
# SMTP сервер: smtp.yandex.ru, порт: 465 (SSL) или 587 (STARTTLS)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL:false}
spring.mail.properties.mail.smtp.ssl.required=${MAIL_SMTP_SSL_REQUIRED:false}
# Дополнительные настройки для Yandex SMTP (порт 465 с SSL)
# Согласно инструкции: smtp.yandex.ru, порт 465, требуется аутентификация
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.fallback=false
spring.mail.properties.mail.smtp.ssl.trust=smtp.yandex.ru
spring.mail.from=${MAIL_FROM:noreply@landorshop.ru}
spring.mail.to=${MAIL_TO:admin@landorshop.ru}
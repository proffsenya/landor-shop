# Редирект с IP-адреса на домен
server {
    listen 80 default_server;
    server_name _;

    # Редирект всех запросов с IP на корневой домен
    return 301 https://landor-shop.ru$request_uri;
}

# Редирект с HTTP на HTTPS для landor-shop.ru
server {
    listen 80;
    server_name landor-shop.ru;

    # Редирект на HTTPS
    return 301 https://landor-shop.ru$request_uri;
}

# Редирект с HTTP на HTTPS для www.landor-shop.ru
server {
    listen 80;
    server_name www.landor-shop.ru;

    # Редирект на HTTPS
    return 301 https://www.landor-shop.ru$request_uri;
}

# HTTPS сервер для landor-shop.ru (корневой домен)
server {
    listen 443 ssl;
    http2 on;
    server_name landor-shop.ru;

    # SSL сертификаты для корневого домена
    ssl_certificate /etc/nginx/ssl/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/private.key;

    # SSL настройки
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    keepalive_timeout 70;
    
    # OCSP Stapling для ускорения проверки сертификата
    # Раскомментируйте следующие строки, если у вас есть файл корневого сертификата ca.crt
    # ssl_stapling on;
    # ssl_trusted_certificate /etc/nginx/ssl/ca.crt;
    # resolver 8.8.8.8;

    root /usr/share/nginx/html;
    index index.html;

    # Логирование
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Безопасные заголовки
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Robots.txt и sitemap.xml
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }
    
    location = /sitemap.xml {
        access_log off;
        log_not_found off;
    }

    # SPA routing - все запросы на index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Кеширование статических файлов
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Отключить логирование для favicon
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    # Проксирование API запросов на бэкенд через Docker network
    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Таймауты для долгих запросов
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# Редирект с IP по HTTPS на домен
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    # SSL сертификаты для корневого домена (fallback)
    ssl_certificate /etc/nginx/ssl/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/private.key;

    # SSL настройки
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    keepalive_timeout 70;

    # Редирект всех запросов с IP на корневой домен
    return 301 https://landor-shop.ru$request_uri;
}

